name: Update profile statistics

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_profile_stats.py"
      - ".github/workflows/update-profile-stats.yml"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh statistics card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_stats.py
      - name: Commit updated card
        run: |
          if git diff --quiet -- assets/profile-header.svg; then
            echo "Statistics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-header.svg
          git commit -m "Update profile statistics"
          git push
